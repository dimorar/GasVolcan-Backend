spring.application.name=gasvolcan-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gasvolcan?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:GasVolcanLocalDevelopmentSecretKeyChangeBeforeDeploying2026}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
